# SHELLScriptLens — suite bench: ceilings (timeout exit semantics + races).
# See shellscript-all.yaml header for how to run.
model:
  backend: openai_compatible
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  optimizer: muse-spark-1.3-contributor
  target: muse-spark-1.3-contributor
  reasoning_effort: xhigh

train:
  num_epochs: 4
  batch_size: 5

gradient:
  minibatch_size: 5
  merge_batch_size: 5

optimizer:
  learning_rate: 4
  lr_scheduler: cosine
  use_slow_update: true
  use_meta_skill: true

evaluation:
  use_gate: true

env:
  name: dtdskills
  skill_init: data/seed_empty.md
  skill_name: shellscript
  skill_dir: ""
  split_mode: split_dir
  split_dir: data/suites/ceilings
  tier: 3
  workers: 3
  exec_timeout: 600
  max_completion_tokens: 96000
