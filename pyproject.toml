[project]
name = "shellscriptlens"
version = "0.1.0"
description = "SHELLScriptLens: a SkillLens-shaped lab for judging shell artifacts (.sh, exits, bytes, manifests). Offline, local-only."
requires-python = ">=3.13"
dependencies = ["pyyaml>=6"]
readme = "PYPI_README.md"
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


[project.scripts]
shellscriptlens = "shellscriptlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shellscriptlens"]


[tool.hatch.build.targets.wheel.force-include]
"data" = "shellscriptlens/data"
"presets" = "shellscriptlens/presets"
"vendor" = "shellscriptlens/vendor"
